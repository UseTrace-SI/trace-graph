name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Go checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache-dependency-path: go.sum
      - name: Dependency vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: Verify pure Go build
        run: go build ./...
        env:
          CGO_ENABLED: '0'
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race -count=1 -timeout=5m ./...
      - name: Repeat regression checks 100 times
        run: go test -race -count=100 -run 'TestRegression|TestCompanion' -timeout=10m ./...
      - name: Tree-sitter vet
        run: go vet -tags treesitter ./...
      - name: Tree-sitter race tests
        run: go test -race -tags treesitter -count=1 -timeout=5m ./...
      - name: Repeat Tree-sitter regression checks 100 times
        run: go test -race -tags treesitter -count=100 -run 'TestRegression|TestCompanion' -timeout=10m ./...
